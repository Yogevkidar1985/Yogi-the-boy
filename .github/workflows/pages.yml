name: Deploy report to GitHub Pages

# Publishes index.html as a public GitHub Pages site.
# Requires the repository to be Public (free plan) or on GitHub Pro (private).
# Once that's true, this workflow auto-enables Pages and deploys — no manual
# Pages settings needed. Trigger it from the Actions tab ("Run workflow") or by
# pushing to the branch.

on:
  push:
    branches: ["claude/stein-9-property-report-jnoic2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (index.html only)
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
